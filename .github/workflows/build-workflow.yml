on:
  workflow_call:
    inputs:
      foundation:
        required: true
        type: string
      platform:
        required: true
        type: string
      action:
        description: Action to perform, either "plan" or "test"
        required: true
        default: 'plan'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.foundation }}
    env:
      TG_TF_PATH: tofu
      TG_PROVIDER_CACHE: 1 # enable provider caching for a speeding up tf inits
      TF_IN_AUTOMATION: true
      TG_NON_INTERACTIVE: true

      # required to enable for azurerm backend, the azurerm provider seems to be fine without these two keys
      ARM_CLIENT_ID: ${{ vars.azure_client_id }}
      ARM_USE_OIDC: true

      # required for the github deployment
      GITHUB_APP_PEM_FILE: ${{ secrets.LIVKID_GITHUB_APP_PEM_FILE }} # note: this environment secret must be set up manually on the github repo

      # required for meshstack e2e tests (stackit platform)
      MESHSTACK_API_KEY_CLOUDFOUNDATION: ${{ secrets.MESHSTACK_API_KEY_CLOUDFOUNDATION }}

      #
      STACKIT_USE_OIDC: "1"
      STACKIT_SERVICE_ACCOUNT_EMAIL: ${{ vars.stackit_service_account_email }}


    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-nix-shell
        with:
          prepare_terraform: true

      - name: Setup gcloud auth
        # note: STACKIT uses GCP for state backends right now
        if: ${{ inputs.platform == 'gcp' || inputs.platform == 'stackit' }}
        id: 'auth'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2.1.13
        with:
          service_account: '${{ vars.gcp_service_account }}' # sourced from gh environment variable
          workload_identity_provider: '${{ vars.gcp_workload_identity_provider }}'

      - name: Setup az auth
        if: ${{ inputs.platform == 'azure' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.azure_client_id }}
          tenant-id: ${{ vars.azure_tenant_id }}
          subscription-id: ${{ vars.azure_subscription_id }}

      - name: Setup aws auth
        if: ${{ inputs.platform == 'aws' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ vars.aws_iam_role }}
          role-session-name: github-actions-${{ github.run_id }}

      # stackit doesn't need specific auth setup because the terraform provider directly
      # detects the github actions environment

      - name: terraform plan
        if: ${{ inputs.action == 'plan' }}
        run: |
          terragrunt plan \
            --all \
            --working-dir="./foundations/${{ inputs.foundation }}/platforms/${{ inputs.platform }}" \
            -- -lock=false -concise

      - name: run tests
        if: ${{ inputs.action == 'test' }}
        run: |
          terragrunt test \
            --all \
            --working-dir="./foundations/${{ inputs.foundation }}/platforms/${{ inputs.platform }}"
