name: Deploy OVH Users
on:
  workflow_dispatch:
    inputs:
      buildingBlockRun:
        description: "Building Block Run Object"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: likvid-prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup meshstack auth
        id: setup-meshstack-auth
        uses: meshcloud/actions-register-source@62ed10e3edbe5fe622aa4c3a876d325c6ab5e4bb # v2.0.2
        with:
          client_id: ${{ vars.BUILDINGBLOCK_API_CLIENT_ID }}
          key_secret: ${{ secrets.BUILDINGBLOCK_API_KEY_SECRET }}
          steps: |
            [
              {
                "id": "create-ovh-user",
                "displayName": "Create Users in OVH if not exist"
              }
            ]

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Run User Sync for OVH
        id: create-ovh-user
        run: |
          npm install ovh
          set -e  # Fail on error
          node index.ts
        working-directory: kit/ovh/buildingblocks/projects_users/buildingblock
        env:
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_APPLICATION_KEY: ${{ secrets.OVH_APPLICATION_KEY }}
          MESH_USERS: ${{ steps.setup-meshstack-auth.outputs.users }}

      - name: Send status
        if: ${{ steps.create-ovh-user.outcome == 'success' || steps.create-ovh-user.outcome == 'failure' }}
        uses: meshcloud/actions-send-status@1865f7369d2697708f139c765e3d4caaac0277f4 # v2.1.2
        with:
          step_id: "create-ovh-user"
          step_status: ${{ steps.create-ovh-user.outcome == 'success' && 'SUCCEEDED' || 'FAILED' }}
          user_message: "create user in ovh if needed..."

      - name: Send final status
        if: ${{ always() }}
        uses: meshcloud/actions-send-status@1865f7369d2697708f139c765e3d4caaac0277f4 # v2.1.2
        with:
          run_status: ${{ job.status == 'success' && 'SUCCEEDED' || 'FAILED' }}
