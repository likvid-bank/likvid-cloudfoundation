repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terragrunt_fmt
      - id: terragrunt_providers_lock
        stages:
          - manual # note: this step is very expensive, so you need to invoke it explicitly via `--hook-stage manual`
        args:
          - --args=-platform=darwin_arm64
          - --args=-platform=darwin_amd64
          - --args=-platform=linux_amd64

      - id: terraform_tflint
        files: ^kit/
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl # share a single tflint config file for all modules

      # tfupdate hooks for aligning terraform and provider versions
      # aligning versions helps build performance becuase there's less providers to download/cache across all our modules
      - id: tfupdate
        name: tfupdate terraform
        args:
          - --args=terraform
          - --args=--version ">= 1.0"
          # this module declares `>= 1.12.0` on purpose; the repo-wide floor would lower it
          - --args=--ignore-path "foundations/likvid-prod/platforms/aks/aks-app-template"

      - id: tfupdate
        name: tfupdate hashicorp/time
        args:
          - --args=provider hashicorp/time
          - --args=--version "0.14.1"
          - --args=--ignore-path "kit/.*/buildingblocks/.*"
          - --args=--ignore-path "kit/.*/demos/.*"

      # azurerm, aws and integrations/github are deliberately behind latest. Each is at least one major
      # version back (azurerm 5.x, aws 6.x, github 6.x), and crossing a major means breaking changes
      # across live Azure and AWS infrastructure. Those are their own plan-verified migrations, not a
      # version-alignment sweep.
      - id: tfupdate
        name: tfupdate hashicorp/azurerm
        args:
          - --args=provider hashicorp/azurerm
          - --args=--version "3.116.0"
          - --args=--ignore-path "kit/.*/buildingblocks/.*"
          - --args=--ignore-path "kit/.*/demos/.*"
          - --args=--ignore-path "kit/azure/meshplatform-au"
          - --args=--ignore-path "kit/azure/landingzones/au-cloud-native"
          - --args=--ignore-path "kit/azure/bootstrap"
          # this module declares `~> 4.0` on purpose; the repo-wide pin would drag it back a major
          - --args=--ignore-path "foundations/likvid-prod/platforms/aks/meshstack/platform"

      - id: tfupdate
        name: tfupdate hashicorp/azuread
        args:
          - --args=provider hashicorp/azuread
          - --args=--version "3.9.0"
          - --args=--ignore-path "kit/.*/buildingblocks/.*"
          - --args=--ignore-path "kit/.*/demos/.*"
          - --args=--ignore-path "kit/azure/meshplatform-au"


      - id: tfupdate
        name: tfupdate hashicorp/aws
        args:
          - --args=provider hashicorp/aws
          - --args=--version "5.65.0"
          - --args=--ignore-path "kit/.*/buildingblocks/.*"
          - --args=--ignore-path "kit/.*/demos/.*"

      - id: tfupdate
        name: tfupdate hashicorp/random
        args:
          - --args=provider hashicorp/random
          - --args=--version "3.9.0"
          - --args=--ignore-path "kit/.*/buildingblocks/.*"
          - --args=--ignore-path "kit/.*/demos/.*"

      - id: tfupdate
        name: tfupdate hashicorp/null
        args:
          - --args=provider hashicorp/null
          - --args=--version "3.3.1"
          - --args=--ignore-path "kit/.*/buildingblocks/.*"
          - --args=--ignore-path "kit/.*/demos/.*"

      - id: tfupdate
        name: tfupdate hashicorp/local
        args:
          - --args=provider hashicorp/local
          - --args=--version "2.9.0"
          - --args=--ignore-path "kit/.*/buildingblocks/.*"
          - --args=--ignore-path "kit/.*/demos/.*"


      - id: tfupdate
        name: tfupdate integrations/github
        args:
          - --args=provider integrations/github
          - --args=--version "5.42.0"
          - --args=--ignore-path "kit/.*/buildingblocks/.*"
          - --args=--ignore-path "kit/.*/demos/.*"
          # this module declares `>= 6.0.0` on purpose; the repo-wide pin would drag it back a major
          - --args=--ignore-path "foundations/likvid-prod/platforms/aks/aks-app-template"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # Use the ref you want to point at
    hooks:
      - id: trailing-whitespace
        exclude: "^compliance/"
